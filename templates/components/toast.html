{% load static %}
<div id="toast-component" class="toast" popover="manual">
    <div class="toast-header">
        <strong id="toast-title">Notification</strong>
        <button type="button" class="toast-close" onclick="document.getElementById('toast-component').hidePopover()">&times;</button>
    </div>
    <div id="toast-body" class="toast-body">
        Sample message goes here.
    </div>
</div>
